---
# The portal owns named.conf.local; use a dedicated authoritative DNS host.
- name: Create the BIND zone directory with inherited bind ownership
  ansible.builtin.file:
    path: /etc/bind/zones
    state: directory
    owner: root
    group: bind
    mode: '2755'

- name: Find existing generated zone files
  ansible.builtin.find:
    paths: /etc/bind/zones
    patterns: '*.db'
    file_type: file
  register: bind_zones

- name: Repair access to existing generated zone files
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: bind
    mode: '0644'
  loop: "{{ bind_zones.files }}"
  loop_control:
    label: "{{ item.path }}"
  notify: restart named

- name: Keep the portal zone configuration readable by BIND
  ansible.builtin.file:
    path: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: '0644'

- name: Install authoritative-only BIND options
  ansible.builtin.copy:
    src: files/named.conf.options
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: '0644'
    backup: true
  notify: restart named

- name: Include the portal zone configuration
  ansible.builtin.lineinfile:
    path: /etc/bind/named.conf
    regexp: '^\s*include\s+"/etc/bind/named.conf.local";'
    line: 'include "/etc/bind/named.conf.local";'
  notify: restart named

- name: Validate BIND configuration and zone readability as the bind user
  ansible.builtin.command:
    argv: [runuser, -u, bind, --, named-checkconf, -z]
  changed_when: false

- name: Apply pending BIND restarts
  ansible.builtin.meta: flush_handlers

- name: Enable and start the authoritative DNS server
  ansible.builtin.systemd_service:
    name: named
    enabled: true
    state: started

- name: Verify BIND control access
  ansible.builtin.command:
    argv: [/usr/sbin/rndc, status]
  changed_when: false

- name: Verify that dig is installed
  ansible.builtin.command:
    argv: [dig, -v]
  changed_when: false

- name: Verify system DNS resolves the configured portal and nameserver names
  ansible.builtin.command:
    argv: [getent, ahostsv4, "{{ item }}"]
  loop: "{{ [settingsns1, settingsns2, settingsdn] | unique | list }}"
  changed_when: false
